
name: Rust Production Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: ferum

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: linux-x86_64
            target: x86_64-unknown-linux-gnu
            android: false
          - asset: android-aarch64
            target: aarch64-linux-android
            android: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux only: cross-link against GLIBC 2.36
      - name: Install Zig
        if: ${{ !matrix.android }}
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: ${{ !matrix.android }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install cargo-ndk
        if: matrix.android
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build optimized binary (Linux)
        if: ${{ !matrix.android }}
        run: |
          cargo zigbuild --locked --release \
            --target "${{ matrix.target }}.2.36" \
            --bin "$BINARY_NAME"

      - name: Build optimized binary (Android)
        if: matrix.android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using NDK at: $ANDROID_NDK_HOME"
          cargo ndk --platform 24 --target arm64-v8a \
            build --locked --release --bin "$BINARY_NAME"

      - name: Verify Linux GLIBC requirements
        if: ${{ !matrix.android }}
        run: |
          readelf --version-info \
            "target/${{ matrix.target }}/release/${BINARY_NAME}" \
            | grep -oE 'GLIBC_[0-9.]+' \
            | sort -Vu || true

      - name: Package binary and checksum
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="${BINARY_NAME}-${VERSION}-${{ matrix.asset }}.tar.gz"

          mkdir -p dist
          install -m 755 \
            "target/${{ matrix.target }}/release/${BINARY_NAME}" \
            "dist/${BINARY_NAME}"

          tar -C dist -czf "dist/${ARCHIVE}" "${BINARY_NAME}"
          cd dist
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          rm "${BINARY_NAME}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
